<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Module 14 Calculation Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        input,
        select,
        button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .primary-button {
            background-color: #1769aa;
            color: white;
        }

        .secondary-button {
            background-color: #666;
            color: white;
        }

        .edit-button {
            background-color: #e0a800;
            color: black;
            margin-right: 5px;
        }

        .delete-button {
            background-color: #c62828;
            color: white;
        }

        .message {
            min-height: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .success {
            color: #087f23;
        }

        .error {
            color: #c62828;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #eeeeee;
        }

        .empty-message {
            text-align: center;
            color: #666;
        }

        @media (max-width: 750px) {
            form {
                grid-template-columns: 1fr;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            table {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="header">
            <div>
                <h1>Calculation Manager</h1>
                <p>
                    Browse, read, edit, add, and delete calculations.
                </p>
            </div>

            <div class="user-controls">
                <span id="current-user"></span>

                <button
                    id="logout-button"
                    class="secondary-button"
                    type="button"
                >
                    Log Out
                </button>
            </div>
        </header>

        <section>
            <h2 id="form-title">Add Calculation</h2>

            <form id="calculation-form">
                <input
                    id="number-a"
                    type="number"
                    step="any"
                    placeholder="First number"
                    required
                >

                <input
                    id="number-b"
                    type="number"
                    step="any"
                    placeholder="Second number"
                    required
                >

                <select id="calculation-type" required>
                    <option value="Add">Add</option>
                    <option value="Sub">Subtract</option>
                    <option value="Multiply">Multiply</option>
                    <option value="Divide">Divide</option>
                </select>

                <button
                    id="submit-button"
                    class="primary-button"
                    type="submit"
                >
                    Add Calculation
                </button>
            </form>

            <button
                id="cancel-edit-button"
                class="secondary-button"
                type="button"
                hidden
            >
                Cancel Edit
            </button>

            <div id="calculation-message" class="message"></div>
        </section>

        <section>
            <h2>Saved Calculations</h2>

            <table>
                <thead>
                    <tr>
                        <th>First Number</th>
                        <th>Second Number</th>
                        <th>Operation</th>
                        <th>Result</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="calculations-table-body">
                    <tr>
                        <td colspan="5" class="empty-message">
                            Loading calculations...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="/static/js/calculations.js"></script>
</body>
</html>
