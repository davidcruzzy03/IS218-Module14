<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Register | Module 13</title>

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Create Account</h1>

            <p class="subtitle">
                Register to access the calculator application.
            </p>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        minlength="3"
                        maxlength="50"
                        required
                    >

                    <small>
                        Username must contain at least 3 characters.
                    </small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        required
                    >

                    <small>
                        Password must contain at least 8 characters.
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" id="register-button">
                    Register
                </button>
            </form>

            <div
                id="register-message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>

            <p class="auth-link">
                Already have an account?
                <a href="/login">Log in</a>
            </p>

            <p class="auth-link">
                <a href="/">Return to calculator</a>
            </p>
        </section>
    </main>

    <script src="/static/js/register.js"></script>
</body>
</html>
